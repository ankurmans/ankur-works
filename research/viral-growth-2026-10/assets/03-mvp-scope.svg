<rect x="85" y="453" width="1030" height="516" rx="20" fill="#ffc451"/><text x="127" y="520" fill="#181715" font-family="DM Sans,Arial,sans-serif" font-size="26" font-weight="800" letter-spacing="2">THE FIRST-RELEASE SCOPE CARD</text><line x1="127" y1="643" x2="1071" y2="643" stroke="#1c1b18" stroke-opacity=".3"/><text x="127" y="595" fill="#181715" font-family="DM Sans,Arial,sans-serif" font-size="24" font-weight="800" >01</text><text x="203" y="595" fill="#181715" font-family="DM Sans,Arial,sans-serif" font-size="34" font-weight="800" >First user</text><text x="550" y="595" fill="#181715" font-family="DM Sans,Arial,sans-serif" font-size="27" font-weight="500" >Who has the problem today?</text><line x1="127" y1="734" x2="1071" y2="734" stroke="#1c1b18" stroke-opacity=".3"/><text x="127" y="686" fill="#181715" font-family="DM Sans,Arial,sans-serif" font-size="24" font-weight="800" >02</text><text x="203" y="686" fill="#181715" font-family="DM Sans,Arial,sans-serif" font-size="34" font-weight="800" >Core job</text><text x="550" y="686" fill="#181715" font-family="DM Sans,Arial,sans-serif" font-size="27" font-weight="500" >What must they finish?</text><line x1="127" y1="825" x2="1071" y2="825" stroke="#1c1b18" stroke-opacity=".3"/><text x="127" y="777" fill="#181715" font-family="DM Sans,Arial,sans-serif" font-size="24" font-weight="800" >03</text><text x="203" y="777" fill="#181715" font-family="DM Sans,Arial,sans-serif" font-size="34" font-weight="800" >Success signal</text><text x="550" y="777" fill="#181715" font-family="DM Sans,Arial,sans-serif" font-size="27" font-weight="500" >What proves it worked?</text><line x1="127" y1="916" x2="1071" y2="916" stroke="#1c1b18" stroke-opacity=".3"/><text x="127" y="868" fill="#181715" font-family="DM Sans,Arial,sans-serif" font-size="24" font-weight="800" >04</text><text x="203" y="868" fill="#181715" font-family="DM Sans,Arial,sans-serif" font-size="34" font-weight="800" >Not yet</text><text x="550" y="868" fill="#181715" font-family="DM Sans,Arial,sans-serif" font-size="27" font-weight="500" >What can wait until later?</text>
