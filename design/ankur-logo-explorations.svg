<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 760" role="img" aria-labelledby="title desc">
<title id="title">Ankur Works logo explorations</title>
<desc id="desc">Three original vector logo directions: element tile, structural AN monogram, and work loop.</desc>
<rect width="1280" height="760" fill="#f3efe6"/>
<text x="44" y="67" fill="#ef6a45" font-family="Arial,sans-serif" font-size="17" font-weight="700" letter-spacing="4">ANKUR.WORKS / MARK STUDIES</text>
<text x="44" y="126" fill="#171715" font-family="Arial,sans-serif" font-size="54" font-weight="700" letter-spacing="-3">A mark worth keeping.</text>
<text x="45" y="159" fill="#625d54" font-family="Arial,sans-serif" font-size="18">Three original directions, drawn for both a profile photo and a tiny favicon.</text>
<rect x="44" y="202" width="378" height="506" rx="22" fill="#fffaf2" stroke="#d8d2c7" stroke-width="2"/>
<text x="68" y="243" fill="#ef6a45" font-family="Arial,sans-serif" font-size="14" font-weight="700" letter-spacing="2">01 / ELEMENT</text>
<image x="68" y="267" width="210" height="210" href="data:image/svg+xml;base64,"/>
<text x="300" y="293" fill="#797268" font-family="Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="1">SMALL</text>
<image x="299" y="306" width="68" height="68" href="data:image/svg+xml;base64,"/>
<text x="68" y="530" fill="#171715" font-family="Arial,sans-serif" font-size="27" font-weight="700" letter-spacing="-1">An, the builder element</text>
<text x="68" y="571" fill="#625d54" font-family="Arial,sans-serif" font-size="15">Playful and unmistakably personal.</text>
<text x="68" y="595" fill="#625d54" font-family="Arial,sans-serif" font-size="15">Best for a social avatar.</text>
<path d="M68 631H398" stroke="#d8d2c7" stroke-width="2"/>
<text x="68" y="670" fill="#171715" font-family="Arial,sans-serif" font-size="21" font-weight="700" letter-spacing="-1">ankur<tspan fill="#ef6a45">.</tspan>works</text>
<rect x="445" y="202" width="378" height="506" rx="22" fill="#fffaf2" stroke="#d8d2c7" stroke-width="2"/>
<text x="469" y="243" fill="#ef6a45" font-family="Arial,sans-serif" font-size="14" font-weight="700" letter-spacing="2">02 / STRUCTURE</text>
<image x="469" y="267" width="210" height="210" href="data:image/svg+xml;base64,"/>
<text x="701" y="293" fill="#797268" font-family="Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="1">SMALL</text>
<image x="700" y="306" width="68" height="68" href="data:image/svg+xml;base64,"/>
<text x="469" y="530" fill="#171715" font-family="Arial,sans-serif" font-size="27" font-weight="700" letter-spacing="-1">A + n, built from strokes</text>
<text x="469" y="571" fill="#625d54" font-family="Arial,sans-serif" font-size="15">A proper monogram with a strong silhouette.</text>
<text x="469" y="595" fill="#625d54" font-family="Arial,sans-serif" font-size="15">My pick for the main mark.</text>
<path d="M469 631H799" stroke="#d8d2c7" stroke-width="2"/>
<text x="469" y="670" fill="#171715" font-family="Arial,sans-serif" font-size="21" font-weight="700" letter-spacing="-1">ankur<tspan fill="#ef6a45">.</tspan>works</text>
<rect x="846" y="202" width="378" height="506" rx="22" fill="#fffaf2" stroke="#d8d2c7" stroke-width="2"/>
<text x="870" y="243" fill="#ef6a45" font-family="Arial,sans-serif" font-size="14" font-weight="700" letter-spacing="2">03 / WORK LOOP</text>
<image x="870" y="267" width="210" height="210" href="data:image/svg+xml;base64,"/>
<text x="1102" y="293" fill="#797268" font-family="Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="1">SMALL</text>
<image x="1101" y="306" width="68" height="68" href="data:image/svg+xml;base64,"/>
<text x="870" y="530" fill="#171715" font-family="Arial,sans-serif" font-size="27" font-weight="700" letter-spacing="-1">A mark that keeps moving</text>
<text x="870" y="571" fill="#625d54" font-family="Arial,sans-serif" font-size="15">A softer personal symbol for repeated work.</text>
<text x="870" y="595" fill="#625d54" font-family="Arial,sans-serif" font-size="15">Best for a favicon or app icon.</text>
<path d="M870 631H1200" stroke="#d8d2c7" stroke-width="2"/>
<text x="870" y="670" fill="#171715" font-family="Arial,sans-serif" font-size="21" font-weight="700" letter-spacing="-1">ankur<tspan fill="#ef6a45">.</tspan>works</text>
